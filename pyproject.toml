[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-note"
version = "1.0.3"
description = "Local-first notes and notebooks for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lukas Geiger" }]
keywords = [
  "llm",
  "agents",
  "notes",
  "sqlite",
  "local-first",
  "agent-memory",
  "notebooks",
  "privacy-first",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/doc-bricks/llm-note"
Documentation = "https://github.com/doc-bricks/llm-note#readme"
Repository = "https://github.com/doc-bricks/llm-note.git"
Issues = "https://github.com/doc-bricks/llm-note/issues"
Changelog = "https://github.com/doc-bricks/llm-note/blob/main/CHANGELOG.md"
Security = "https://github.com/doc-bricks/llm-note/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/doc-bricks/llm-note/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/doc-bricks/llm-note/blob/main/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/doc-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.scripts]
llm-note = "llm_note.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_note"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["references"]
